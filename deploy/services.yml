services:
  - name: billing
    type: postgres
    host: ${BILLING_POSTGRES_HOST}
    port: 5432

  - name: event-relay
    type: postgres
    host: ${EVT_POSTGRES_HOST}
    port: 5432

  - type: rabbitmq
    name: rabbit
    management_url: ${RABBITMQ_MANAGEMENT_URL}
    user: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  - type: http
    name: billing.api
    url: http://localhost:8080/health
    depends_on:
      - billing
      - rabbit