services:

  # ---------------------
  # --- Secrets ---
  # ---------------------
  vault:
    image: vault:1.13.0
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
    command: server -dev
    depends_on:
      billing-postgres:
        condition: service_healthy
    networks:
      - billing-net

  # ---------------------
  # --- Discovery ---
  # ---------------------
  consul:
    image: hashicorp/consul # Imagen oficial de Consul
    container_name: consul
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "${CONSUL_PORT}:8500"   # Puerto para la interfaz web y API HTTP
      - "8600:8600/udp"         # Puerto para consultas DNS
    healthcheck:
      test: [ "CMD", "curl", "-f", "${CONSUL_URL}" ]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - observability
      - billing-net

  # ---------------------
  # --- RabbitMQ ---
  # ---------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: billing-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - billing-net

  # ---------------------
  # --- Cache ---
  # ---------------------

  distributedcache:
    image: redis:latest
    container_name: distributedcache
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - billing-net

  # ---------------------
  # --- Observability ---
  # ---------------------
  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  init:
    image: alpine:3.19
    container_name: init
    user: root
    entrypoint: [ "sh", "-c", "chown -R 10001:10001 /var/tempo" ]
    volumes:
      - tempo_data:/var/tempo

  # =========================
  # Otel Collector (HUB)
  # =========================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ../tools/otlp/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      #- ./logs:/etc/otelcol   # volumen compartido
    ports:
      - "4317:4317"
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"
    networks:
      - observability
      - billing-net

  # =========================
  # PROMETHEUS (METRICS)
  # =========================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # necesario para Tempo
      - --enable-feature=exemplar-storage       # opcional, para exemplars trace↔metric
    volumes:
      - ../tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
      - billing-net

  # =========================
  # LOKI (LOGS)
  # =========================

  loki:
    image: grafana/loki:3.4.2      # ← antes: 2.9.4
    container_name: loki
    restart: unless-stopped
    volumes:
      - ../tools/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    networks:
      - observability
      - billing-net

  # =========================
  # TEMPO (TRACES)
  # =========================

  tempo:
    image: grafana/tempo:2.7.1   # versión fija y reciente
    container_name: tempo
    restart: unless-stopped
    volumes:
      - ../tools/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    command: [ "-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    depends_on:
      - init
    networks:
      - observability
      - billing-net

  # =========================
  # PROMTAIL (pipeline intermedio)
  # =========================

  #promtail:
  #  image: grafana/promtail:latest
  #  container_name: promtail
  #  volumes:
  #    - ../tools/promtail/promtail.yaml:/etc/promtail/promtail.yaml
  #    - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #    - /var/run/docker.sock:/var/run/docker.sock
  #  command: -config.file=/etc/promtail/promtail.yaml
  #  networks:
  #    - observability
  #    - billing-net
  #  depends_on:
  #    - loki

  # =========================
  # GRAFANA (UI)
  # =========================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../tools/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - otel-collector
    networks:
      - observability
      - billing-net

  # ---------------------
  # --- Database      ---
  # ---------------------
  billing-postgres:
    image: postgres:15
    container_name: billing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - billing-net

  eventrelay-postgres:
    image: postgres:15
    container_name: eventrelay-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eventrelaylogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - billing-net

  # ---------------------
  # --- Services      ---
  # ---------------------

  billing.api:
    build:
      context: ../../src/backend   # ← Esto debe apuntar a D:\Repositorio\Billing
      dockerfile: src/Services/Billing.API/Dockerfile
    container_name: billing.api
    ports:
      - "6000:8080"
      - "6060:8081"
    environment:
      ConnectionStrings__Database: "Server=billing-postgres;Port=5432;Database=billingdb;User Id=postgres;Password=postgres;Include Error Detail=true"
      DatabaseConfig__serviceName: billing-postgres
      DatabaseConfig__Server: localhost
      DatabaseConfig__Port: 5432
      DatabaseConfig__Database: billingdb
      MessageBroker__Host: billing-mq
      MessageBroker__Username: guest
      MessageBroker__Password: guest
      MessageBroker__Port: 5672
      ConsulConfig__ServiceName: "billing.api"
      ConsulConfig__ServiceId: "billing.api-1"
      ConsulConfig__ServiceAddress: "billing.api"
      ConsulConfig__ServicePort: 8080
      ConsulConfig__HealthCheckUrl: "http://billing.api:8080/health"
      ConsulConfig__Host: "http://consul:8500"
      ConsulConfig__TLSSkipVerify: false
      FeatureManagement__InvoiceFulfillment: true
      logging__Service: "app"
      logging__ServiceName: "billing.api"
      logging__LokiUrl: "http://loki:3100/loki/api/v1/push"
      VaultSettings__Address: http://vault:8200
      VaultSettings__Role: "billing-role"
      VAULT_TOKEN: dev-token
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      MT_LICENSE_PATH: /masstransit/license.txt
      DOTNET_USE_POLLING_FILE_WATCHER: true
      DOTNET_RUNNING_IN_CONTAINER: true
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: billing.api
      OTEL_SEMCONV_STABILITY_OPT_IN: http   # emite http.request.method, http.response.status_code
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://billing.api:8080/health" ]
      interval: "30s"
      timeout: "10s"
      retries: 5
    depends_on:
      - consul
      - vault
      - rabbitmq
      - billing-postgres
      - otel-collector
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    networks:
      - billing-net

  eventrelay:
    build:
      context: ../../src/backend
      dockerfile: src/Workers/Integration.Services/Dockerfile
    container_name: eventrelay
    command: [ "dotnet", "Integration.Services.dll" ]
    depends_on:
      - rabbitmq
      - eventrelay-postgres
    environment:
      ConnectionStrings__Database: "Server=eventrelay-postgres;Port=5432;Database=eventrelaylogdb;User Id=postgres;Password=postgres;Include Error Detail=true"
      MessageBroker__Host: billing-mq
      MessageBroker__Username: guest
      MessageBroker__Password: guest
      MessageBroker__Port: 5672
    networks:
      - billing-net

  # ---------------------
  # --- Gateway      ---
  # ---------------------

  yarpapigateway:
    container_name: yarpapigateway
    build:
      context: ../../src/backend   # ← Esto debe apuntar a D:\Repositorio\Axenta
      dockerfile: src/ApiGateways/YarpApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      #- ASPNETCORE_HTTPS_PORTS=8081
    depends_on:
      - billing.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    networks:
      - billing-net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  observability:
    driver: bridge
  billing-net:
    driver: bridge