server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  - job_name: otel-collector-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: otel-collector
          service: billing.api       # <-- nombre del servicio
          environment: dev           # <-- opcional
          instance: billing          # <-- opcional
          __path__: /etc/otelcol/otel-collector-logs.json
    pipeline_stages:
      - json:
          expressions:
            service: service.name
            traceId: traceId
            spanId: spanId